
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portofolio Siswa — MI AZ-ZAHRO</title>
<style>
:root{
  --blue-900:#0b3d2e; --blue-800:#146c43; --blue-700:#15803d; --blue-600:#16a34a;
  --blue-100:#cdeedd; --blue-50:#f0fdf4; --bg:#e9f6ee; --card:#ffffff;
  --text:#1e293b; --muted:#64748b; --line:#e2e8f0; --amber:#f59e0b;
  --green:#16a34a; --red:#ef4444;
  --shadow:0 10px 30px rgba(11,61,46,.10);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
input,textarea,select{font-family:inherit}

/* ---------- Top bar ---------- */
.topbar{
  background:linear-gradient(135deg,var(--blue-800),var(--blue-600));
  color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px;
  box-shadow:0 4px 18px rgba(11,61,46,.18); position:sticky; top:0; z-index:20;
}
.topbar .cap{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;flex:none}
.topbar .titles{line-height:1.15}
.topbar .titles b{font-size:17px;display:block}
.topbar .titles span{font-size:12.5px;opacity:.85}
.topbar .spacer{flex:1}
.topbar .badge{font-size:12px;background:rgba(255,255,255,.18);padding:7px 13px;border-radius:999px;display:none}
@media(min-width:640px){.topbar .badge{display:block}}

/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}

/* ---------- Hero / search ---------- */
.hero{text-align:center; padding:30px 20px 6px;}
.hero h1{margin:0 0 8px;font-size:25px;color:var(--blue-900)}
.hero p{margin:0 0 20px;color:var(--muted);font-size:14.5px}
.search{max-width:560px;margin:0 auto;position:relative;}
.search input{
  width:100%;padding:15px 18px 15px 50px;border-radius:14px;border:1.5px solid #bfe3cd;
  font-size:15.5px;background:#fff;box-shadow:var(--shadow);outline:none;color:var(--text);
  transition:.18s border-color,.18s box-shadow;
}
.search input:focus{border-color:var(--blue-600);box-shadow:0 0 0 4px rgba(22,163,74,.16)}
.search .ico{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search .clear{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;background:#eaf5ee;color:var(--muted);
  display:none;place-items:center;font-size:15px;
}
.search .clear.show{display:grid}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 0 6px}
.class-filter{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.cls-chip{
  background:#fff;border:1px solid var(--line);color:var(--blue-800);font-size:13px;font-weight:600;
  padding:7px 14px;border-radius:999px;transition:.15s;
}
.cls-chip:hover{border-color:#bfe3cd}
.cls-chip.active{background:var(--blue-600);border-color:var(--blue-600);color:#fff}

/* ---------- Student list ---------- */
.list{margin-top:18px;display:grid;gap:10px}
.student{
  display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:6px 10px 6px 6px;box-shadow:0 2px 10px rgba(11,61,46,.05);
  transition:.16s transform,.16s box-shadow,.16s border-color;
}
.student:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#bfe3cd}
.student-main{display:flex;align-items:center;gap:14px;flex:1;text-align:left;padding:8px 8px;min-width:0}
.student .chev{color:#a9cdb8;font-size:20px;margin-left:auto;transition:.16s}
.student:hover .chev{color:var(--blue-600);transform:translateX(3px)}
.card-edit{
  width:38px;height:38px;border-radius:10px;background:var(--blue-50);border:1px solid var(--line);
  color:var(--blue-800);font-size:15px;flex:none;display:grid;place-items:center;transition:.15s;
}
.card-edit:hover{background:var(--blue-100)}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  color:#fff;font-weight:700;font-size:16px;letter-spacing:.5px;box-shadow:inset 0 -6px 14px rgba(0,0,0,.12);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.student .meta{line-height:1.25;min-width:0}
.student .meta b{font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student .meta span{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:46px 14px;font-size:14.5px;line-height:1.7}
.empty .big{font-size:44px;display:block;margin-bottom:12px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--blue-800);
  box-shadow:0 2px 8px rgba(11,61,46,.05);transition:.16s;
}
.btn:hover{border-color:#bfe3cd;background:var(--blue-50)}
.btn.primary{background:var(--blue-700);color:#fff;border-color:var(--blue-700)}
.btn.primary:hover{background:var(--blue-600)}
.btn.danger{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.btn.danger:hover{background:#fecaca}

/* ---------- Portfolio ---------- */
.crumbbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.crumbs{font-size:13.5px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crumbs b{color:var(--blue-800)}
.edit-note{
  display:flex;align-items:center;gap:9px;background:#fffbe6;border:1px solid #ffe7a3;color:#8a6100;
  padding:11px 15px;border-radius:12px;font-size:13px;margin-bottom:16px;
}
.pf-head{
  display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px;
}
.pf-head .avatar{width:60px;height:60px;font-size:21px}
.pf-head h2{margin:0 0 3px;font-size:19px;color:var(--blue-900)}
.pf-head .sub{font-size:13.5px;color:var(--muted)}
.cv-head{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.cv-head .icon{width:56px;height:56px;border-radius:14px;background:var(--blue-50);border:1px solid var(--blue-100);display:grid;place-items:center;font-size:26px;flex:none}
.cv-head h2{margin:0 0 3px;font-size:19px;color:var(--blue-900)}
.cv-head .sub{font-size:13.5px;color:var(--muted)}
.pf-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:820px){.pf-grid{grid-template-columns:262px 1fr;align-items:start}}

/* Sidebar folder tree */
.side{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.side .side-title{padding:13px 16px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line)}
.folder-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 16px;font-size:14px;color:var(--text);transition:.14s;border-left:3px solid transparent}
.folder-item:hover{background:var(--blue-50)}
.folder-item.active{background:var(--blue-50);border-left-color:var(--blue-600);color:var(--blue-800);font-weight:700}
.folder-item .fico{font-size:17px;flex:none}
.folder-item .num{color:var(--muted);font-weight:600;font-size:12.5px;min-width:20px}

/* Content */
.content{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card .card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;color:var(--blue-900)}
.card .card-h .fico{font-size:18px}
.card .card-b{padding:18px}
.muted-note{font-size:12.5px;color:var(--muted);margin:0 0 12px}

/* Data diri */
.profile{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.profile .photo{
  width:118px;height:150px;border-radius:12px;flex:none;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#e3f7ec,#c9eed8);display:grid;place-items:center;border:1px solid #c6ecd6;
}
.profile .photo .avatar{width:74px;height:74px;font-size:26px}
.photo-img{width:100%;height:100%;object-fit:cover;display:block}
.photo-click{cursor:pointer}
.photo-overlay{
  position:absolute;inset:0;background:rgba(11,61,46,.55);color:#fff;display:flex;flex-direction:column;
  gap:5px;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;text-align:center;
  opacity:0;transition:.15s;padding:6px;
}
.photo-click:hover .photo-overlay{opacity:1}
.fields{flex:1;min-width:220px;display:grid;gap:9px}
.fields .row{display:grid;grid-template-columns:118px 1fr;gap:10px;font-size:14px;align-items:center}
.fields .row span{color:var(--muted)}
.fields .row b{color:var(--text);font-weight:600}

/* Inputs */
.inp{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;color:var(--text);background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--blue-600);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.fields .row .inp{font-weight:600}

/* Edit lists */
.edit-list{display:grid;gap:9px}
.edit-row{display:grid;grid-template-columns:1.2fr 1.6fr .8fr auto;gap:8px;align-items:center}
.edit-row.two{grid-template-columns:1.1fr 1.8fr auto}
.edit-row.grade{grid-template-columns:2fr 1fr auto}
.del-btn{width:36px;height:36px;border-radius:9px;background:#fee2e2;color:#dc2626;font-size:14px;display:grid;place-items:center;flex:none}
.del-btn:hover{background:#fecaca}
.add-btn{margin-top:10px;border-style:dashed;color:var(--blue-800)}
@media(max-width:640px){ .edit-row,.edit-row.two,.edit-row.grade{grid-template-columns:1fr} .del-btn{width:100%} }

/* Table */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{background:var(--blue-50);color:var(--blue-800);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
td.val{text-align:right;font-weight:700}
tr:last-child td{border-bottom:none}
.avg{margin-top:14px;display:flex;align-items:center;justify-content:space-between;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:11px;padding:11px 15px;font-size:14px}
.avg b{color:var(--blue-800);font-size:16px}

/* Chips list (ekskul) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--blue-50);border:1px solid var(--blue-100);color:var(--blue-800);padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}

/* Prestasi */
.prestasi{display:grid;gap:12px}
.prestasi .item{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.prestasi .medal{width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:22px;background:#fff7e6;border:1px solid #ffe0a8}
.prestasi .item b{display:block;font-size:14.5px}
.prestasi .item span{font-size:12.5px;color:var(--muted)}
.prestasi .lvl{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--green);background:#e9f9ef;border:1px solid #bfe9cd;padding:5px 11px;border-radius:999px;white-space:nowrap}

/* Files & gallery */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center;transition:.16s;background:#fff}
.tile:hover{border-color:#bfe3cd;box-shadow:0 6px 16px rgba(11,61,46,.10);transform:translateY(-2px)}
.tile .fico{font-size:28px;display:block;margin-bottom:8px}
.tile b{font-size:13px;display:block;word-break:break-word}
.tile span{font-size:11.5px;color:var(--muted)}
.tile .thumb{height:88px;border-radius:9px;margin-bottom:9px;display:grid;place-items:center;font-size:30px;background:linear-gradient(160deg,#eefbf3,#d9f3e3)}
.tile.doc .fico{color:var(--red)}
.tile.word .fico{color:var(--blue-700)}
.tile.pdf .fico{color:var(--red)}
.tile.img .fico{color:var(--green)}

/* Upload */
.upload{margin-top:16px;border:1.5px dashed #bfe3cd;border-radius:12px;padding:14px;background:linear-gradient(160deg,#f5fdf8,#eefbf3)}
.upload-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.upload-head .u-title{font-size:13px;font-weight:700;color:var(--blue-800);display:flex;align-items:center;gap:7px}
.upload-head .u-hint{font-size:11.5px;color:var(--muted)}
.upload-head .u-btn{margin-left:auto;background:var(--blue-600);color:#fff;border-color:var(--blue-600);padding:8px 14px;font-size:13px}
.upload-head .u-btn:hover{background:var(--blue-700)}
.up-tiles{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.up-empty{font-size:12.5px;color:var(--muted);padding:6px 2px}
.up-tile{position:relative}
.up-tile .rm-btn{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(239,68,68,.92);color:#fff;font-size:12px;display:grid;place-items:center;z-index:2;opacity:0;transition:.15s}
.up-tile:hover .rm-btn{opacity:1}
.tile-link{display:block}

.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:34px}
.foot .flow{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;box-shadow:0 2px 8px rgba(11,61,46,.05)}
.foot .flow b{color:var(--blue-800)}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,61,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:540px;box-shadow:0 24px 60px rgba(11,61,46,.35);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-head b{font-size:16px;color:var(--blue-900);flex:1}
.modal-close{width:34px;height:34px;border-radius:9px;background:#f1f5f9;color:var(--muted);font-size:15px;display:grid;place-items:center}
.modal-body{padding:18px;display:grid;gap:13px}
.modal-body label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.modal-actions{display:flex;gap:9px;align-items:center;margin-top:4px;flex-wrap:wrap}
.class-add{display:flex;gap:9px}
.class-add .inp{flex:1}
.class-row{display:flex;gap:9px;align-items:center}
.class-row .inp{flex:1}
.class-row .class-count{font-size:12px;color:var(--muted);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--blue-900);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 10px 26px rgba(11,61,46,.3);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="topbar">
  <div class="cap">🎓</div>
  <div class="titles">
    <b>Portofolio Siswa</b>
    <span>MI AZ-ZAHRO</span>
  </div>
  <div class="spacer"></div>
  <div class="badge">Satu folder per siswa</div>
</div>

<div id="app"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input id="photoInput" type="file" accept="image/*" hidden />

<script>
/* ============================================================
   PORTAL PORTOFOLIO MI AZ-ZAHRO
   Data asli (bukan dummy) — diisi oleh wali kelas.
   Tersimpan di browser (localStorage). Bisa Ekspor/Impor.
   ============================================================ */

const SECTIONS = [
  {id:"diri",    num:"01", title:"Data Diri",                 icon:"👤"},
  {id:"belajar", num:"02", title:"Hasil Belajar",             icon:"📊"},
  {id:"ekskul",  num:"03", title:"Kegiatan Ekstrakurikuler",  icon:"⚽"},
  {id:"prestasi",num:"04", title:"Prestasi",                  icon:"🏆"},
  {id:"karya",   num:"05", title:"Karya & Projek",            icon:"📁"},
  {id:"foto",    num:"06", title:"Foto / Dokumentasi",        icon:"📷"}
];

/* ---------- state & penyimpanan ---------- */
const LS_KEY = "mi-azzahro-portofolio-v2";
const app = document.getElementById("app");
const modalRoot = document.getElementById("modalRoot");
const toastEl = document.getElementById("toast");
const photoInput = document.getElementById("photoInput");

let students = [];   // data siswa asli
let classes  = [];   // daftar kelas, mis. ["5A","5B"]
let editMode = false;
let homeFilter = "all";
let viewState = { st:null, folder:"all" };
let readOnly = false;        // mode wali murid: hanya lihat & unduh
let shareState = null;       // data dari link berbagi (#w=...)
let localSnapshot = null;    // cadangan data walas saat beralih ke mode lihat

let storageOK = true;
function saveAll(){
  if(readOnly) return;  // mode lihat tidak boleh mengubah data
  try{ localStorage.setItem(LS_KEY, JSON.stringify({ students, classes })); }
  catch(e){ storageOK = false; }
}
function loadAll(){
  try{
    // uji apakah penyimpanan browser tersedia (bisa diblokir di sebagian browser/HP)
    localStorage.setItem(LS_KEY + "__t", "1");
    localStorage.removeItem(LS_KEY + "__t");
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.students)) students = d.students.map(ensureStudentShape);
      if(d && Array.isArray(d.classes)) classes = d.classes;
    }
  }catch(e){ storageOK = false; }
}
function ensureStudentShape(st){
  st.sekolah  = st.sekolah || "MI AZ-ZAHRO";
  st.photo    = st.photo || "";
  st.nilai    = st.nilai || [];
  st.ekskul   = st.ekskul || [];
  st.prestasi = st.prestasi || [];
  st.karya    = st.karya || [];
  st.foto     = st.foto || [];
  return st;
}
function newId(name){
  return slug(name) + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
}
function slug(s){
  return String(s||"siswa").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || "siswa";
}

/* ---------- helpers ---------- */
function initials(name){
  return String(name||"?").split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
}
const AV_COLORS = ["#16a34a","#0d9488","#15803d","#059669","#22c55e","#0891b2","#65a30d","#047857"];
function colorFor(id){
  let h=0; for(const ch of String(id)) h=(h*31+ch.charCodeAt(0))>>>0;
  return AV_COLORS[h % AV_COLORS.length];
}
function avatar(st, cls){
  const inner = st.photo ? `<img src="${st.photo}" alt="${esc(st.name)}" />` : initials(st.name);
  return `<div class="avatar ${cls||''}" style="background:${colorFor(st.id)}">${inner}</div>`;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove("show"), 2200);
}
function nilaiAvg(st){
  const nums = (st.nilai||[]).map(r=>parseFloat(r[1])).filter(n=>!isNaN(n));
  if(!nums.length) return null;
  return Math.round(nums.reduce((a,b)=>a+b,0)/nums.length);
}
function classCount(c){ return students.filter(s=>s.kelas===c).length; }

/* ---------- daftar siswa (dipakai beranda & halaman kelas) ---------- */
function studentsListHTML(list, withEdit){
  return list.map(s => `
    <div class="student">
      <button class="student-main" data-id="${s.id}">
        ${avatar(s)}
        <span class="meta">
          <b>${esc(s.name)}</b>
          <span>${s.kelas ? "Kelas "+esc(s.kelas)+" · " : ""}NIS ${esc(s.nis||"-")}</span>
        </span>
        <span class="chev">›</span>
      </button>

    classes.push(name);
    classes.sort();
    saveAll();
    openClassManager();
    toast("Kelas ditambahkan: " + name);
  };
  modalRoot.querySelector("#newClass").addEventListener("keydown", (e)=>{ if(e.key==="Enter") modalRoot.querySelector("#addClassBtn").click(); });

  modalRoot.querySelectorAll(".class-name").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const oldName = inp.dataset.old;
      const newName = inp.value.trim();
      if(!newName || newName === oldName) { inp.value = oldName; return; }
      if(classes.includes(newName)){ toast("Nama kelas sudah dipakai"); inp.value = oldName; return; }
      classes = classes.map(c => c === oldName ? newName : c);
      classes.sort();
      students.forEach(s => { if(s.kelas === oldName) s.kelas = newName; });
      saveAll();
      openClassManager();

    });
  });

      confirmDialog(

        ()=>{
          classes = classes.filter(c => c !== name);
          students.forEach(s => { if(s.kelas === name) s.kelas = ""; });
          saveAll();
          openClassManager();
          toast("Kelas dihapus: " + name);
        },
        "Ya, hapus kelas"
      );
    };
  });
}

async function shortenUrl(longUrl){
  const services = [
    u => "https://clck.ru/--?url=" + encodeURIComponent(u),
    u => "https://da.gd/shorten?url=" + encodeURIComponent(u)
  ];
  for(const make of services){
    try{
      const res = await fetch(make(longUrl), { method:"GET" });
      if(!res.ok) continue;
      const t = (await res.text()).trim();
      if(/^https?:\/\/\S+$/.test(t) && t.length < longUrl.length) return t;
    }catch(e){}
  }
  return null;
}

function shrinkDataUrl(src, maxDim, q){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      try{ resolve(c.toDataURL("image/jpeg", q)); }catch(e){ resolve(src); }
    };
    img.onerror = ()=> resolve(src);
    img.src = src;
  });
}

/* data ringkas: kunci pendek + buang kolom kosong supaya link lebih pendek */
function compactStudent(s, hasUp){
  const o = {};
  if(hasUp) o.d = s.id;
  if(s.name) o.n = s.name;
  if(s.kelas) o.k = s.kelas;
  if(s.nis) o.i = s.nis;
  if(s.ttl) o.t = s.ttl;
  if(s.alamat) o.a = s.alamat;
  if(s.sekolah && s.sekolah !== "MI AZ-ZAHRO") o.s = s.sekolah;
  if(s.photo) o.p = s.photo;
  const v = (s.nilai||[]).filter(r => r && (r[0] || r[1]));
  const e = (s.ekskul||[]).filter(r => r && (r[0] || r[1]));
  const r = (s.prestasi||[]).filter(x => x && (x[0] || x[1] || x[2]));
  if(v.length) o.v = v;
  if(e.length) o.e = e;
  if(r.length) o.r = r;
  return o;
}
function expandStudents(arr){
  return (arr||[]).map((o, idx)=>({
    id: o.d || ("s" + idx),
    name: o.n || "",
    kelas: o.k || "",
    nis: o.i || "",
    ttl: o.t || "",
    alamat: o.a || "",
    sekolah: o.s || "MI AZ-ZAHRO",
    photo: o.p || "",
    nilai: o.v || [],
    ekskul: o.e || [],
    prestasi: o.r || [],
    karya: [],
    foto: []
  }));
}
async function buildSharePayload(sel, meta, includePhoto){
  let totalUp = 0;
  sel.forEach(s=>{ const u = uploads[s.id]; if(u) for(const f in u) (u[f]||[]).forEach(x=> totalUp += (x.dataUrl||"").length); });
  const skippedUploads = totalUp > 300000;
  const outStudents = [];
  const outUploads = {};
  for(const s of sel){
    const hasUp = !skippedUploads && uploads[s.id] && Object.keys(uploads[s.id]).length > 0;
    if(hasUp) outUploads[s.id] = uploads[s.id];
    const src = Object.assign({}, s);
    src.photo = (includePhoto && s.photo) ? await shrinkDataUrl(s.photo, 160, 0.55) : "";
    outStudents.push(compactStudent(src, hasUp));
  }
  return {
    payload: { v:2, m: meta.mode, k: meta.mode === "all" ? "all" : (meta.kelas || "all"), s: outStudents, u: outUploads },
    skippedUploads
  };
}

/* --- pengemasan data ke dalam link (base64 + kompresi bila tersedia) --- */
function bytesToB64url(bytes){
  let bin = ""; const CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlToBytes(str){
  const b64 = str.replace(/-/g,"+").replace(/_/g,"/");
  const pad = b64.length % 4 ? "=".repeat(4 - (b64.length % 4)) : "";
  const bin = atob(b64 + pad);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function packShare(obj){
  const json = JSON.stringify(obj);
  if(typeof CompressionStream !== "undefined"){
    try{
      const cs = new CompressionStream("deflate-raw");
      const buf = await new Response(new Blob([json]).stream().pipeThrough(cs)).arrayBuffer();
      return "z" + bytesToB64url(new Uint8Array(buf));
    }catch(e){}
  }
  return "p" + bytesToB64url(new TextEncoder().encode(json));
}
async function unpackShare(str){
  const tag = str.charAt(0), body = str.slice(1);
  const bytes = b64urlToBytes(body);
  if(tag === "z"){
    const ds = new DecompressionStream("deflate-raw");
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

function importData(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.students)) throw new Error("format");
      students = d.students.map(ensureStudentShape);
      classes = Array.isArray(d.classes) ? d.classes.slice() : [];
      students.forEach(s=>{ if(s.kelas && !classes.includes(s.kelas)) classes.push(s.kelas); });
      classes.sort();
      saveAll();
      renderHome();
      toast("Data berhasil diimpor ✓");
    }catch(e){ toast("File tidak valid"); }
  };
  r.readAsText(file);
}

const uploads = {};
const ACCEPT = ".jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.rtf,.csv,.zip";

function fmtSize(b){
  if(b < 1024) return b + " B";
  if(b < 1048576) return (b/1024).toFixed(1) + " KB";
  return (b/1048576).toFixed(1) + " MB";
}
function fileIcon(f){
  const n = (f.name||"").toLowerCase();
  if((f.type||"").startsWith("image/")) return "🖼️";
  if(f.type === "application/pdf" || /\.pdf$/.test(n)) return "📄";
  if(/\.(docx?|rtf)$/.test(n)) return "📝";
  if(/\.(xlsx?|csv)$/.test(n)) return "📊";
  if(/\.(pptx?)$/.test(n)) return "📽️";
  if(/\.zip$/.test(n)) return "🗜️";
  if(/\.txt$/.test(n)) return "📃";
  return "📎";
}
function uploadBlock(st, folder){

function renderUploadTiles(container, stId, folder){

            ? `<div class="thumb" style="background-image:url('${f.dataUrl}');background-size:cover;background-position:center"></div>`
            : `<span class="fico">${fileIcon(f)}</span>`}
          <b>${esc(f.name)}</b><span>${fmtSize(f.size)} · klik buka</span>
        </a>
      </div>`;
  }).join("");
  container.querySelectorAll(".rm-btn").forEach(b=>{
    b.addEventListener("click", (e)=>{
      e.preventDefault(); e.stopPropagation();
      list.splice(+b.dataset.idx, 1);
      renderUploadTiles(container, stId, folder);
    });
  });
}
function hydrateUploads(root){
  root.querySelectorAll(".upload").forEach(box=>{
    renderUploadTiles(box.querySelector(".up-tiles"), box.dataset.st, box.dataset.folder);
  });
}
function handleUploadInput(input){
  const box = input.closest(".upload");
  const stId = box.dataset.st, folder = box.dataset.folder;
  const tiles = box.querySelector(".up-tiles");
  Array.from(input.files).forEach(file=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      uploads[stId] = uploads[stId] || {};
      uploads[stId][folder] = uploads[stId][folder] || [];
      uploads[stId][folder].push({name:file.name, type:file.type, size:file.size, dataUrl:reader.result});
      renderUploadTiles(tiles, stId, folder);
      toast("File ditambahkan: " + file.name);
    };
    reader.readAsDataURL(file);
  });
  input.value = "";
}

/* ============================================================
   FOTO PROFIL
   ============================================================ */
function compressImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try{ resolve(c.toDataURL("image/jpeg", quality)); }catch(e){ resolve(null); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
photoInput.addEventListener("change", async ()=>{
  const f = photoInput.files[0];
  photoInput.value = "";
  if(!f || !viewState.st) return;
  toast("Memproses foto...");

  if(dataUrl){ viewState.st.photo = dataUrl; saveAll(); rerender(); toast("Foto profil diperbarui ✓"); }

});

function exitShare(){
  readOnly = false;
  shareState = null;
  if(localSnapshot){
    students = localSnapshot.students;
    classes = localSnapshot.classes;
    for(const k in uploads) delete uploads[k];
    Object.assign(uploads, localSnapshot.uploads || {});
    localSnapshot = null;
  }
}

async function route(){
  const h = decodeURIComponent(location.hash || "");

  // 1) link berbagi — data ada di dalam link
  if(h.indexOf("#w=") === 0){
    if(!localSnapshot) localSnapshot = { students, classes, uploads };
    try{
      const p = await unpackShare(h.slice(3));
      shareState = {
        classes: [],
        students: p.s ? expandStudents(p.s).map(ensureStudentShape) : (p.students || []).map(ensureStudentShape),
        uploads: p.u || p.uploads || {},
        mode: p.m || p.mode || "all",
        kelas: p.k || p.kelas || "all"
      };
      readOnly = true;
      students = shareState.students;
      classes = shareState.classes;
      for(const k in uploads) delete uploads[k];
      Object.assign(uploads, shareState.uploads);
      if(shareState.mode === "siswa" && shareState.students.length) renderPortfolio(shareState.students[0], "all");
      else renderClassView(shareState.kelas);
    }catch(e){
      exitShare();
      toast("Link tidak valid atau rusak.");
      renderHome();
    }
    window.scrollTo(0,0);
    return;
  }

  // 2) masih di mode lihat (pindah folder / buka siswa)
  if(shareState){
    let m = h.match(/^#\/s\/([^\/]+)(?:\/([^\/]+))?$/);
    if(m){
      const st = shareState.students.find(s => s.id === m[1]);
      if(st){ renderPortfolio(st, m[2] || "all"); window.scrollTo(0,0); return; }
    }
    m = h.match(/^#\/kelas\/(.+)$/);
    if(m){ renderClassView(m[1]); window.scrollTo(0,0); return; }
    exitShare();
    renderHome();
    window.scrollTo(0,0);
    return;
  }

  // 3) mode walas (normal)
  let m = h.match(/^#\/s\/([^\/]+)(?:\/([^\/]+))?$/);
  if(m){
    const st = students.find(s => s.id === m[1]);
    if(st){ renderPortfolio(st, m[2] || "all"); window.scrollTo(0,0); return; }
  }
  m = h.match(/^#\/kelas\/(.+)$/);
  if(m){ renderClassView(m[1]); window.scrollTo(0,0); return; }
  renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ============================================================
   Delegasi event
   ============================================================ */
app.addEventListener("click", (e)=>{
  const ub = e.target.closest(".u-btn");
  if(ub){ const inp = ub.parentElement.querySelector(".up-input"); if(inp) inp.click(); return; }

  if(e.target.closest(".photo-click")){ photoInput.click(); return; }

  const de = e.target.closest("[data-del-ekskul]");
  if(de){ viewState.st.ekskul.splice(+de.dataset.delEkskul,1); saveAll(); rerender(); return; }

  const dp = e.target.closest("[data-del-prestasi]");
  if(dp){ viewState.st.prestasi.splice(+dp.dataset.delPrestasi,1); saveAll(); rerender(); return; }

  const dn = e.target.closest("[data-del-nilai]");
  if(dn){ viewState.st.nilai.splice(+dn.dataset.delNilai,1); saveAll(); rerender(); return; }

  const add = e.target.closest("[data-add]");
  if(add){
    const t = add.dataset.add;
    if(t === "ekskul") viewState.st.ekskul.push(["",""]);
    else if(t === "prestasi") viewState.st.prestasi.push(["","",""]);
    else if(t === "nilai") viewState.st.nilai.push(["",""]);
    saveAll(); rerender(); return;
  }
});

app.addEventListener("input", (e)=>{
  const el = e.target;
  if(!viewState.st || !el.dataset) return;
  if(el.dataset.field){
    viewState.st[el.dataset.field] = el.value;
    if(el.dataset.field === "kelas"){
      const k = el.value.trim();
      if(k && !classes.includes(k)){ classes.push(k); classes.sort(); }
    }
    saveAll(); updateHeader();
  }else if(el.dataset.kind){
    const arr = viewState.st[el.dataset.kind];
    if(arr && arr[+el.dataset.idx]){ arr[+el.dataset.idx][+el.dataset.k] = el.value; saveAll(); }
  }
});

app.addEventListener("change", (e)=>{
  if(e.target.classList && e.target.classList.contains("up-input")) handleUploadInput(e.target);
});

/* ---------- start ---------- */
loadAll();
route();
if(!storageOK){
  setTimeout(()=>toast("Catatan: penyimpanan browser diblokir — data tidak tersimpan otomatis. Sebaiknya buka file dengan Chrome/Edge."), 900);
}
</script>
